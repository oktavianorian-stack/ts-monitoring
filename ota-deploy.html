<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTA Deploy &amp; Live Chat Kolaborasi - TS Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-vh-100 py-4">
  <div class="container-xl">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="h4 fw-bold text-white mb-0">OTA Deploy &amp; Live Chat Kolaborasi</h1>
        <small class="text-white-50">Kirim update via IP lokal &amp; komunikasi antar Developer / AGY</small>
      </div>
      <a href="index.html" class="btn btn-akasha-gold btn-sm fw-bold">Kembali ke Dashboard</a>
    </div>

    <div class="row g-4">
      <!-- OTA Upload Card -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h2 class="h6 fw-bold mb-3">1. Kirim Paket Update OTA</h2>
            <div class="mb-3">
              <label class="form-label small fw-semibold">PIN Keamanan OTA</label>
              <input type="password" id="ota-pin" class="form-control form-control-sm" placeholder="Masukkan PIN OTA..." />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Pilih File (.zip atau .html / .js / .css)</label>
              <input type="file" id="ota-files" multiple accept=".zip,.html,.js,.css,.json" class="form-control form-control-sm" />
            </div>
            <button onclick="deployOta()" class="btn btn-akasha-gold w-100 fw-bold">Kirim &amp; Terapkan Update</button>
            <div id="ota-status" class="mt-3 small"></div>
          </div>
        </div>
      </div>

      <!-- Live Chat Kolaborasi / AGY -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body d-flex flex-column">
            <h2 class="h6 fw-bold mb-2">2. Live Chat Kolaborasi (Developer &amp; AGY)</h2>
            <div id="chat-box" class="flex-grow-1 border rounded-4 p-3 mb-3 overflow-y-auto" style="height: 320px; background: rgba(15, 23, 42, 0.45);"></div>
            <div class="row g-2">
              <div class="col-4">
                <input type="text" id="chat-author" class="form-control form-control-sm" placeholder="Nama / AGY (misal: AGY-Rian)" />
              </div>
              <div class="col-6">
                <input type="text" id="chat-msg" class="form-control form-control-sm" placeholder="Tulis pesan koordinasi..." onkeydown="if(event.key==='Enter') sendChat()" />
              </div>
              <div class="col-2">
                <button onclick="sendChat()" class="btn btn-primary btn-sm w-100 fw-semibold">Kirim</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function deployOta() {
      const pin = document.getElementById('ota-pin').value.trim();
      const files = document.getElementById('ota-files').files;
      const status = document.getElementById('ota-status');
      if (!pin) return alert('Masukkan PIN OTA!');
      if (!files.length) return alert('Pilih minimal 1 file!');

      status.innerHTML = '<span class="text-warning">Mengirim paket update...</span>';
      try {
        let payload = {};
        if (files.length === 1 && files[0].name.endsWith('.zip')) {
          const buf = await files[0].arrayBuffer();
          const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
          payload = { zipBase64: b64 };
        } else {
          const fileList = [];
          for (const f of files) {
            fileList.push({ name: f.name, content: await f.text() });
          }
          payload = { files: fileList };
        }

        const res = await fetch('/api/ota-upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-OTA-PIN': pin },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          status.innerHTML = `<span class="text-success fw-bold">Berhasil! Versi baru: ${data.version}. Semua monitor akan reload otomatis.</span>`;
        } else {
          status.innerHTML = `<span class="text-danger fw-bold">Gagal: ${data.error}</span>`;
        }
      } catch (err) {
        status.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      }
    }

    async function loadChat() {
      try {
        const res = await fetch('/api/collab');
        const list = await res.json();
        const box = document.getElementById('chat-box');
        box.innerHTML = (list || []).map(c => `
          <div class="mb-2 p-2 rounded-3" style="background: rgba(255,255,255,0.08);">
            <div class="d-flex justify-content-between small">
              <strong class="text-warning">${c.author || 'Anonim'}</strong>
              <span class="text-white-50" style="font-size:11px;">${c.timestamp || ''}</span>
            </div>
            <div class="small text-white mt-1">${c.message || ''}</div>
          </div>
        `).join('') || '<div class="text-white-50 small">Belum ada pesan kolaborasi.</div>';
        box.scrollTop = box.scrollHeight;
      } catch (_) {}
    }

    async function sendChat() {
      const author = document.getElementById('chat-author').value.trim() || 'Developer';
      const message = document.getElementById('chat-msg').value.trim();
      if (!message) return;
      await fetch('/api/collab', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author, branch: 'local-ota', message })
      });
      document.getElementById('chat-msg').value = '';
      loadChat();
    }

    loadChat();
    setInterval(loadChat, 3000);
  </script>
</body>
</html>
